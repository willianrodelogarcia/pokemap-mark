name: Keep Render awake

on:
  schedule:
    # Render suspende servicios Free tras 15 minutos sin tráfico.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          RENDER_HEALTHCHECK_URL: ${{ secrets.RENDER_HEALTHCHECK_URL }}
        run: |
          test -n "$RENDER_HEALTHCHECK_URL"
          curl --fail --silent --show-error --location \
            --retry 2 --max-time 30 "$RENDER_HEALTHCHECK_URL"
